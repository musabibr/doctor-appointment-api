# Local MongoDB for development: `docker compose up -d`
# The API's default MONGODB_URI (mongodb://127.0.0.1:27017/doctor_appointment) points here.
services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

volumes:
  mongo-data:
